<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="js submit event">
    <title>Submit Event</title>
</head>
<body>
    <h1>JavaScript Submit Event</h1>

    <form id="paymentForm">
        <input id="username" type="text" placeholder="Card Holder Name">
        <input id="cardnumber" type="number" placeholder="16 digit Card Number">
        <input id="cvvnumber" type="number" placeholder="CVV number">

        <p id="error"></p>

        <button type="submit">Pay</button>
    </form>

    <script src="script.js"></script>
</body>
</html>
