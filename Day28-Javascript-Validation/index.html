<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="user login form with RegEx validation">
    <title>Login Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <style>
        body{
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card{
            width: 900px;
            border-radius: 15px;
            overflow: hidden;
        }
        .left-side{
            background: url("https://images.unsplash.com/photo-1486520299386-6d106b22014b?q=80&w=1169&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D")no-repeat center center;
            background-size: cover;
            min-height: 500px;            
        }
    </style>

</head>
<body>

    <div class="card login-card">
        <div class="row g-0">

            <!-- Left side image background -->
             <div class="col-md-6 left-side d-none d-md-block"></div>

             <!-- Right side login form -->
              <div class="col-md-6 p-5 bg-white">
                <h3 class="text-center mb-4">Login</h3>

                <!-- error div -->
                 <div id="alertBox">
                    <!-- div - alert -->
                 </div>

                 <form id="loginForm">
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input id="email" class="form-control" type="text">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input id="password" class="form-control" type="text">
                    </div>

                    <button class="btn btn-primary w-100" type="submit">Login</button>
                 </form>
              </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>
</html>
